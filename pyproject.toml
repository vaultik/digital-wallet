[project]
name = "digital-wallet"
version = "0.1.0"
description = "Multi-Currency Digital Wallet"
authors = [
    {name = "George",email = "fondan.dolgoprundy@gmail.com"}
]
readme = "README.md"
requires-python = "3.12.7"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "greenlet (>=3.4.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
